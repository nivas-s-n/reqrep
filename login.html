<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DeG Data Purity Operations Portal — Secure sign-in to the data purity registry.">
    <title>DeG — Data Purity Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-wrapper">

    <!-- Top Navigation Bar for Spatial Login -->
    <div class="position-absolute top-0 start-0 w-100 p-3 p-md-4 d-flex justify-content-between align-items-center" style="z-index: 10;">
        <div class="d-flex align-items-center gap-2">
            <span class="badge rounded-pill px-3 py-1" style="background: var(--sp-glass-bg); border: 1px solid var(--sp-glass-border); color: var(--sp-text-secondary); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; backdrop-filter: blur(8px);">
                <i class="bi bi-shield-check text-primary me-1"></i>DeG ENTERPRISE SECURE
            </span>
        </div>
        <button id="themeToggle" class="btn btn-sm" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
            <i class="bi bi-moon-fill" id="themeIcon"></i>
        </button>
    </div>

    <!-- Spatial Login Card -->
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-brand-icon mb-3">
                <img src="images/Picture1.png" alt="DeG Logo">
            </div>
            <div>
                <span class="badge rounded-pill px-3 py-1 mb-2" style="background: var(--sp-accent-gradient); color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.6px;">
                    <i class="bi bi-stars me-1"></i>OPERATIONS REGISTRY
                </span>
            </div>
            <h2 class="login-title">Data Purity Register</h2>
            <p class="small mb-0" style="color: var(--sp-text-secondary);">Authenticate with your credentials to enter the operations workspace.</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none small mb-4 py-2 px-3" role="alert"></div>

        <form id="loginForm" autocomplete="on">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <div class="login-input-group">
                    <i class="bi bi-person-fill login-input-icon"></i>
                    <input type="text" class="form-control" id="username" placeholder="Enter username" required
                        autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="login-input-group">
                    <i class="bi bi-lock-fill login-input-icon"></i>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required
                        autocomplete="current-password">
                </div>
            </div>

            <!-- Math CAPTCHA in Spatial Container -->
            <div class="mb-4">
                <div class="captcha-box">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label mb-0" for="captchaAnswer">
                            <i class="bi bi-patch-check-fill me-1" style="color: var(--sp-accent-from);"></i>
                            Security Check
                        </label>
                        <span id="captchaQuestion" class="fw-bold small px-2 py-0.5 rounded-pill" style="background: var(--sp-info-bg); color: var(--sp-accent-from); font-size: 0.78rem;"></span>
                    </div>
                    <div class="login-input-group">
                        <i class="bi bi-calculator-fill login-input-icon"></i>
                        <input type="number" class="form-control no-spinner" id="captchaAnswer"
                            placeholder="Enter the calculation result" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 login-btn-spatial fw-semibold text-white" id="loginBtn">
                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center" style="border-color: var(--sp-border) !important;">
            <p class="small mb-0" style="color: var(--sp-text-muted); font-size: 0.76rem;">
                <i class="bi bi-circle-fill me-1" style="font-size: 7px; color: var(--sp-success);"></i> 
                Authorized personnel only &bull; Activity is logged &amp; monitored
            </p>
        </div>
    </div>

    <!-- Spatial Footer -->
    <div class="position-absolute bottom-0 w-100 py-3 px-4 d-flex justify-content-between align-items-center small" style="color: var(--sp-text-muted); z-index: 5;">
        <span>&copy; 2026 DeG — Data Purity.</span>
        <span class="fw-semibold"><i class="bi bi-circle-fill me-1" style="font-size: 7px;"></i> Created By NS</span>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
